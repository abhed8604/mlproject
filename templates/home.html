<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Prediction</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            line-height: 1.6;
        }
        header {
            margin-bottom: 24px;
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #2563eb;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
        }
        select, input[type="number"] {
            padding: 9px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            outline: none;
            box-sizing: border-box;
            width: 100%;
        }
        select:focus, input[type="number"]:focus {
            border-color: #2563eb;
        }
        button[type="submit"] {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            background-color: #2563eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }
        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }
        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
        }
        .result-box h2 {
            margin: 0 0 8px 0;
            color: #166534;
            font-size: 18px;
        }
        .result-box p {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            color: #15803d;
        }
    </style>
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}" class="back-link">&larr; Back to Home</a>
        <h1>Student Exam Performance Prediction</h1>
        <p>Fill in the student details below to predict their math score.</p>
    </header>

    <main>
        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ethnicity">Race or Ethnicity</label>
                <select id="ethnicity" name="ethnicity" required>
                    <option value="" disabled selected>Select Ethnicity</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="form-group">
                <label for="parental_level_of_education">Parental Level of Education</label>
                <select id="parental_level_of_education" name="parental_level_of_education" required>
                    <option value="" disabled selected>Select Parental Education</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's Degree</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div class="form-group">
                <label for="lunch">Lunch Type</label>
                <select id="lunch" name="lunch" required>
                    <option value="" disabled selected>Select Lunch Type</option>
                    <option value="standard">Standard</option>
                    <option value="free/reduced">Free / Reduced</option>
                </select>
            </div>

            <div class="form-group">
                <label for="test_preparation_course">Test Preparation Course</label>
                <select id="test_preparation_course" name="test_preparation_course" required>
                    <option value="" disabled selected>Select Test Preparation Course</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="form-group">
                <label for="reading_score">Reading Score (0 to 100)</label>
                <input type="number" id="reading_score" name="reading_score" min="0" max="100" placeholder="Enter Reading score" required>
            </div>

            <div class="form-group">
                <label for="writing_score">Writing Score (0 to 100)</label>
                <input type="number" id="writing_score" name="writing_score" min="0" max="100" placeholder="Enter Writing score" required>
            </div>

            <button type="submit">Predict Math Score</button>
        </form>

        {% if results is defined and results is not none %}
        <section class="result-box">
            <h2>Prediction Result</h2>
            <p>Predicted Math Score: {{ results }}</p>
        </section>
        {% endif %}
    </main>
</body>
</html>
